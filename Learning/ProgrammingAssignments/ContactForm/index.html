<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Form Company</title>

    <style>
        body {box-sizing: border-box; margin: 2rem; font-family: Arial;}
        .form-item { width: 420px; display: flex; flex-direction: column; margin-top: 1rem;}
        fieldset{ border: none; margin-left: -.9rem; margin-top: 1rem;}
        input,
        textarea,
        select { padding: .6rem; margin-top: 5px;}
        button { margin-top: 1rem; padding: .6rem;}
        .error { color: red; font-size: 14px;}
    </style>

</head>

<body>

    <h1>Contact Us</h1>

    <form id="contactForm" method="POST">

        <div class="form-item">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>
            <span class="error" id="nameError"></span>
        </div>

        <div class="form-item">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
            <span class="error" id="emailError"></span>
        </div>

        <div class="form-item">
            <label for="phone">Phone Number</label>
            <input type="text" id="phone" name="phone" required>
            <span class="error" id="phoneError"></span>
        </div>

        <div class="form-item">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="4" required minlength="2"></textarea>
            <span class="error" id="messageError"></span>
        </div>

        <fieldset>
            <legend>Preferred Contact Method</legend>
            <input type="radio" name="contact" value="Email" required> Email
            <input type="radio" name="contact" value="Phone"> Phone
            <input type="radio" name="contact" value="Both"> Both
        </fieldset>

        <div class="form-item">
            <label for="inquiry">Inquiry Type</label>
            <select id="inquiry" name="inquiry" required>
                <option value="" disabled selected>Select an option</option>
                <option value="General Inquiry">General Inquiry</option>
                <option value="Support Request">Support Request</option>
                <option value="Feedback">Feedback</option>
            </select>
        </div>

        <button type="submit">Submit and Preview</button>
    </form>

    <hr>

    <h2>Preview Your Data</h2>
    <p><strong>Name:</strong> <span id="previewName"></span></p>
    <p><strong>Email:</strong> <span id="previewEmail"></span></p>
    <p><strong>Phone:</strong> <span id="previewPhone"></span></p>
    <p><strong>Message:</strong> <span id="previewMessage"></span></p>
    <p><strong>Contact Method:</strong> <span id="previewContact"></span></p>
    <p><strong>Inquiry Type:</strong> <span id="previewInquiry"></span></p>

    <script>
        document.getElementById("contactForm").addEventListener("submit", function (event) {

            event.preventDefault(); // Prevent POST (simulate GET preview)

            let isValid = true;

            // Get values
            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const phone = document.getElementById("phone").value.trim();
            const message = document.getElementById("message").value.trim();
            const contact = document.querySelector('input[name="contact"]:checked');
            const inquiry = document.getElementById("inquiry").value;

            // Reset errors
            document.querySelectorAll(".error").forEach(el => el.textContent = "");

            // Validation
            if (name === "") {
                document.getElementById("nameError").textContent = "Name is required";
                isValid = false;
            }

            const emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
            if (!emailPattern.test(email)) {
                document.getElementById("emailError").textContent = "Invalid email format";
                isValid = false;
            }

            const phonePattern = /^[0-9]{10}$/;
            if (!phonePattern.test(phone)) {
                document.getElementById("phoneError").textContent = "Phone must be 10 digits";
                isValid = false;
            }

            if (message === "") {
                document.getElementById("messageError").textContent = "Message is required";
                isValid = false;
            }

            if (!isValid) return;

            // Preview (GET-style display)
            document.getElementById("previewName").textContent = name;
            document.getElementById("previewEmail").textContent = email;
            document.getElementById("previewPhone").textContent = phone;
            document.getElementById("previewMessage").textContent = message;
            document.getElementById("previewContact").textContent = contact ? contact.value : "";
            document.getElementById("previewInquiry").textContent = inquiry;

        });
    </script>

</body>

</html>
