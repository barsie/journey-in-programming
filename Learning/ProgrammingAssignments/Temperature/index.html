<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
</head>
<body class="">
    <style>
        body{ width: auto; display:  flex; flex-direction: column; align-items: center;}
        form{ border: solid 1px black; padding-top: 1rem; padding-bottom: 4rem; padding-left: 2rem; padding-right: 2rem; border-radius: 2rem;}
        h2{ font-size: 2rem;}
        input, select, button{ width: 100%; padding: .5rem; margin-top: 1rem;}
        .btn{ background-color: #0072dd; border: none; color: white; font-weight: 700; font-size: 1.3rem;}
        #solution, #error{ font-size: 1.4rem; font-weight: 600; text-align: center;}
    </style>
    <form id="converterForm">
        <h2>Temperature Converter</h2>

        <input type="text" id="degree" placeholder="Enter temperature">

        <select id="conversionType">
            <option value="celsiusToFahrenheit">Celsius to Fahrenheit</option>
            <option value="fahrenheitToCelcius">Fahrenheit to Celsius</option>
        </select>
        
        <button type="button" id="submit" class="btn">Convert</button>

        <p id="solution"></p>
        <p id="error" style="color:red;"></p>
    </form>

<script>
    const submitButton = document.getElementById('submit');
    const insertNumber = document.getElementById('degree');
    const conversionType = document.getElementById('conversionType');
    const solution = document.getElementById('solution');
    const error = document.getElementById('error');

    submitButton.addEventListener('click', function () {

        let degree = insertNumber.value;

        // Clear previous messages
        solution.innerHTML = "";
        error.innerHTML = "";

        // Validate input
        if (degree === "" || isNaN(degree)) {
            error.innerHTML = "Please enter a valid numeric temperature.";
            return;
        }

        degree = Number(degree);

        let result;

        // Conversion logic using control structure
        if (conversionType.value === "celsiusToFahrenheit") {
            result = (degree * 9/5) + 32;
            solution.innerHTML = degree + "°C is "  + result.toFixed(2) + " °F";
        } 
        else if (conversionType.value === "fahrenheitToCelcius") {
            result = (degree - 32) * 5/9;
            solution.innerHTML = degree + "°F is " + result.toFixed(2) + " °C";
        }
    });
</script>
</body>
</html>
